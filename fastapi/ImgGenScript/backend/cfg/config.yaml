# ================================================================
# ImgGen Backend Configuration
# ================================================================

server:
  fastapi_host: "127.0.0.1"
  fastapi_port: 8000
  comfyui_host: "127.0.0.1"
  comfyui_port: 8188

paths:
  comfyui_input_dir: "/workspace/ComfyUI_app/input"
  comfyui_output_dir: "/workspace/ComfyUI_app/output"
  project_images_dir: "/workspace/ImgGenScript/files/images"
  csv_dir: "/workspace/ImgGenScript/files/csv"
  workflow_dir: "backend/cfg/workflow"

prompts:
  special_characteristics_weight: 1.2

generation:
  fullbody:
    use_reference_pose: true
    k0_seed: 42
    k0_steps: 8
    k0_cfg: 1.5
    k0_sampler_name: "dpmpp_sde"
    k0_scheduler: "karras"
    k1_seed: 42
    k1_steps: 8
    k1_cfg: 1.5
    k1_sampler_name: "dpmpp_sde"
    k1_scheduler: "karras"
    batch_size: 1
    k2_seed: 42
    k2_steps: 6
    k2_cfg: 1.5
    k2_sampler_name: "dpmpp_sde"
    k2_scheduler: "karras"
    k2_denoise: 0.45
    checkpoint: "RealVisXL_V5.0_fp16.safetensors"
    ipadapter_lora_name: "ip-adapter-faceid-plusv2_sdxl_lora.safetensors"
    ipadapter_lora_strength_model: 0.7
    ipadapter_lora_strength_clip: 1.0
    clip_vision_model: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
    insightface_model_name: "buffalo_l"
    faceid_loader_preset: "FACEID PLUS V2"
    faceid_loader_lora_strength: 0.7
    faceid_weight: 0.7
    faceid_v2_weight: 0.5
    faceid_weight_type: "original"
    faceid_combine_embeds: "concat"
    faceid_start: 0.0
    faceid_end: 1.0
    plus_face_loader_preset: "FACEID PLUS V2"
    plus_face_weight: 0.5
    plus_face_weight_type: "original"
    plus_face_combine_embeds: "concat"
    plus_face_start: 0.0
    plus_face_end: 1.0
    pose_controlnet_model: "diffusion_pytorch_model_promax.safetensors"
    pose_controlnet_weight: 0.7
    pose_controlnet_start: 0.0
    pose_controlnet_end: 0.7
    dwpreprocessor_bbox_detector: "yolox_l.onnx"
    dwpreprocessor_pose_estimator: "dw-ll_ucoco_384_bs5.torchscript.pt"
    detailer_bbox_model: "bbox/face_yolov8m.pt"
    detailer_seed: 42
    detailer_steps: 20
    detailer_cfg: 7.0
    detailer_sampler_name: "dpmpp_2m"
    detailer_scheduler: "karras"
    detailer_denoise: 0.45
    detailer_feather: 5
    detailer_bbox_threshold: 0.5
    detailer_bbox_dilation: 10
    detailer_bbox_crop_factor: 3.0
    detailer_drop_size: 10
    hands_refiner_mask_bbox_padding: 20
    hands_refiner_mask_type: "default"
    hands_refiner_mask_expand: 0
    hands_refiner_detect_thr: 0.1
    hands_refiner_presence_thr: 0.1
    hands_refiner_controlnet_model: "diffusion_pytorch_model_promax.safetensors"
    hands_refiner_controlnet_weight: 0.7
    hands_refiner_controlnet_start: 0.0
    hands_refiner_controlnet_end: 0.7
    hands_refiner_seed: 42
    hands_refiner_steps: 20
    hands_refiner_cfg: 7.0
    hands_refiner_sampler_name: "dpmpp_2m"
    hands_refiner_scheduler: "karras"
    hands_refiner_denoise: 0.45

portrait:
  use_reference_pose: true
  k1_seed: 42
  k1_steps: 8
  k1_cfg: 1.5
  k1_sampler_name: "dpmpp_sde"
  k1_scheduler: "karras"
  k1_denoise: 0.45
  batch_size: 1
  k2_seed: 42
  k2_steps: 6
  k2_cfg: 1.5
  k2_sampler_name: "dpmpp_sde"
  k2_scheduler: "karras"
  k2_denoise: 0.45
  checkpoint: "RealVisXL_V5.0_fp16.safetensors"
  ipadapter_lora_name: "ip-adapter-faceid-plusv2_sdxl_lora.safetensors"
  ipadapter_lora_strength_model: 0.7
  ipadapter_lora_strength_clip: 1.0
  clip_vision_model: "CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors"
  insightface_model_name: "buffalo_l"
  faceid_loader_preset: "FACEID PLUS V2"
  faceid_loader_lora_strength: 0.7
  faceid_weight: 0.7
  faceid_v2_weight: 0.5
  faceid_weight_type: "original"
  faceid_combine_embeds: "concat"
  faceid_start: 0.0
  faceid_end: 1.0
  plus_face_loader_preset: "FACEID PLUS V2"
  plus_face_weight: 0.5
  plus_face_weight_type: "original"
  plus_face_combine_embeds: "concat"
  plus_face_start: 0.0
  plus_face_end: 1.0
  detailer_bbox_model: "bbox/face_yolov8m.pt"
  detailer_seed: 42
  detailer_steps: 20
  detailer_cfg: 7.0
  detailer_sampler_name: "dpmpp_2m"
  detailer_scheduler: "karras"
  detailer_denoise: 0.45
  detailer_feather: 5
  detailer_bbox_threshold: 0.5
  detailer_bbox_dilation: 10
  detailer_bbox_crop_factor: 3.0
  detailer_drop_size: 10

verbose:
  images: false
  comfyui: false
  workflow: false
  generation: false
  scene: false

generation_verbose: false
save_workflow: false
