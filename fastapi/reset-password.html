<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BatchApp — Nueva contraseña</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0b0b0f; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #16161c; border: 1px solid #2a2a33; border-radius: 12px;
      padding: 32px; width: 320px;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; text-align: center; }
    .sub { font-size: 12px; color: #888; text-align: center; margin: 0 0 20px; }
    label { display: block; font-size: 12px; color: #999; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
      background: #0f0f14; color: #eee; font-size: 14px; margin-bottom: 14px;
    }
    button {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
      background: #4f6bff; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 12px; text-align: center; min-height: 16px; }
    .msg.ok { color: #7ee2a0; }
    .msg.err { color: #ff8a8a; }
    a { color: #7d92ff; font-size: 12px; text-decoration: none; }
    .back { display: block; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nueva contraseña</h1>
    <p class="sub" id="sub-text">Escribe tu nueva contraseña.</p>

    <form id="reset-form">
      <label for="password">Contraseña nueva</label>
      <input id="password" type="password" minlength="6" required />
      <label for="password2">Confirmar contraseña</label>
      <input id="password2" type="password" minlength="6" required />
      <button type="submit" id="btn">Guardar contraseña</button>
    </form>
    <div class="msg" id="msg"></div>
    <a class="back" href="/">← Volver al inicio de sesión</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('reset-form');
  const msgEl = document.getElementById('msg');

  if (!token) {
    document.getElementById('sub-text').textContent = 'Este link no es válido. Solicita uno nuevo desde la pantalla de recuperación.';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const btn = document.getElementById('btn');

    msgEl.className = 'msg';
    msgEl.textContent = '';

    if (password !== password2) {
      msgEl.textContent = 'Las contraseñas no coinciden';
      msgEl.className = 'msg err';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const res = await fetch('/reset_password_with_token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Ocurrió un error');
      msgEl.textContent = data.message + ' Redirigiendo...';
      msgEl.className = 'msg ok';
      form.style.display = 'none';
      setTimeout(() => { window.location.href = '/'; }, 2000);
    } catch (err) {
      msgEl.textContent = err.message;
      msgEl.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar contraseña';
    }
  });
</script>
</body>
</html>
